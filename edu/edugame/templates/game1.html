<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수어 게임</title>
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            text-align: center;
            background-color: #f4f4f4;
        }
        h1 {
            color: #333;
        }
        .container {
            margin-top: 20px;
        }
        .video-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .question {
            font-size: 24px;
            font-weight: bold;
            margin: 20px;
            color: #007bff;
        }
        .result {
            font-size: 20px;
            font-weight: bold;
            margin: 20px;
            color: #28a745;
        }
        .btn {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
            border-radius: 5px;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>실시간 수어 인식 게임</h1>
    <div class="container">
        <div class="video-container">
            <img id="videoFeed" src="/game1/video_feed" width="640" height="480">
            <p class="question" id="questionText">문제: </p>
            <p class="result" id="gameResult">결과: </p>
            <button class="btn" onclick="fetchQuestion()">새 문제 받기</button>
        </div>
    </div>

    <script>
        function fetchQuestion() {
            fetch('/game1/get_question')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('questionText').innerText = "문제: " + data.question;
                    document.getElementById('gameResult').innerText = "결과: ";
                })
                .catch(error => console.error('문제 가져오기 오류:', error));
        }

        function checkGameStatus() {
            fetch('/game1/get_question')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('questionText').innerText = "문제: " + data.question;
                });

            setInterval(() => {
                fetch('/game1/get_game_info')
                    .then(response => response.json())
                    .then(data => {
                        if (data.game_result) {
                            document.getElementById('gameResult').innerText = "결과: " + data.game_result;
                        }
                    })
                    .catch(error => console.error('게임 상태 가져오기 오류:', error));
            }, 1000);
        }

        window.onload = checkGameStatus;
    </script>
</body>
</html>
